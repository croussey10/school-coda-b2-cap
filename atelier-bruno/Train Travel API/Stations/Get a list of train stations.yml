info:
  name: Get a list of train stations
  type: http
  seq: 1
  tags:
    - Stations

http:
  method: GET
  url: "{{baseUrl}}/stations"
  params:
    - name: page
      value: "1"
      type: query
      description: The page number to return
    - name: limit
      value: "10"
      type: query
      description: The number of items to return per page
    - name: coordinates
      value: 52.5200,13.4050
      type: query
      description: |
        The latitude and longitude of the user's location, to narrow down the search results to sites within a proximity of this location.
    - name: search
      value: Milano Centrale
      type: query
      description: |
        A search term to filter the list of stations by name or address.
    - name: country
      value: DE
      type: query
      description: Filter stations by country code
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

