info:
  name: List existing bookings
  type: http
  seq: 1
  tags:
    - Bookings

http:
  method: GET
  url: "{{baseUrl}}/bookings"
  params:
    - name: page
      value: "1"
      type: query
      description: The page number to return
    - name: limit
      value: "10"
      type: query
      description: The number of items to return per page
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

