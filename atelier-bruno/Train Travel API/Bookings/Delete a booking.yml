info:
  name: Delete a booking
  type: http
  seq: 4
  tags:
    - Bookings

http:
  method: DELETE
  url: "{{baseUrl}}/bookings/:bookingId"
  params:
    - name: bookingId
      value: 1725ff48-ab45-4bb5-9d02-88745177dedb
      type: path
      description: The ID of the booking to retrieve.
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://example.com/oauth/authorize
    accessTokenUrl: https://example.com/oauth/token
    refreshTokenUrl: "{{oauth_refresh_url}}"
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: header
    scope: read write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

