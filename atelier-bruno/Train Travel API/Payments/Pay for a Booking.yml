info:
  name: Pay for a Booking
  type: http
  seq: 1
  tags:
    - Payments

http:
  method: POST
  url: "{{baseUrl}}/bookings/:bookingId/payment"
  params:
    - name: bookingId
      value: 1725ff48-ab45-4bb5-9d02-88745177dedb
      type: path
      description: The ID of the booking to pay for.
  body:
    type: json
    data: |-
      {
        "amount": 49.99,
        "currency": "gbp",
        "source": {
          "object": "card",
          "name": "J. Doe",
          "number": "4242424242424242",
          "cvc": "123",
          "exp_month": 12,
          "exp_year": 2025,
          "address_line1": "123 Fake Street",
          "address_line2": "4th Floor",
          "address_city": "London",
          "address_country": "gb",
          "address_post_code": "N12 9XX"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

